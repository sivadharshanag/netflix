# Render Blueprint — free web service. Media lives in a private
# Cloudflare R2 (or Backblaze B2) bucket, NOT in this repo or on Render.
services:
  - type: web
    name: varunika-birthday
    runtime: node
    plan: free
    region: oregon
    # --include=dev: NODE_ENV=production is set below, which would otherwise
    # make npm skip Vite/TypeScript and the build would fail.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: BIRTHDAY_PASSWORD_HASH
        sync: false
      # --- media storage (S3-compatible: Cloudflare R2 / Backblaze B2) ---
      - key: MEDIA_STORAGE
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
